<!DOCTYPE html>
<html lang="uz" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kirish — BeeAnaliz</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    .input-clean {
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .input-clean:focus {
      box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.15);
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-center items-center p-4 selection:bg-amber-500 selection:text-slate-950 relative overflow-x-hidden">
  
  <!-- Subtle Ambient Glows -->
  <div class="absolute -top-32 -left-32 w-80 h-80 bg-amber-500/10 rounded-full blur-[100px] pointer-events-none"></div>
  <div class="absolute -bottom-32 -right-32 w-80 h-80 bg-yellow-500/10 rounded-full blur-[100px] pointer-events-none"></div>

  <!-- Header Back Link -->
  <div class="w-full max-w-[420px] mb-5 flex items-center justify-between z-10">
    <a href="/" class="inline-flex items-center space-x-2 text-xs font-semibold text-slate-400 hover:text-amber-400 transition group">
      <i data-lucide="arrow-left" class="w-4 h-4 transform group-hover:-translate-x-1 transition"></i>
      <span>Asosiy sahifa</span>
    </a>
    <div class="flex items-center space-x-2">
      <div class="w-7 h-7 rounded-xl bg-gradient-to-tr from-amber-500 to-amber-400 flex items-center justify-center text-slate-950 font-black text-xs shadow-md shadow-amber-500/20">
        <i data-lucide="boxes" class="w-4 h-4"></i>
      </div>
      <span class="font-black tracking-tight text-white text-sm">Bee<span class="text-amber-400">Analiz</span></span>
    </div>
  </div>

  <!-- Main Card -->
  <div class="w-full max-w-[420px] bg-slate-900/90 border border-slate-800/90 rounded-3xl p-6 sm:p-8 shadow-2xl backdrop-blur-2xl z-10">
    
    <!-- Tab Switcher -->
    <div class="grid grid-cols-2 p-1 bg-slate-950/80 rounded-2xl mb-6 border border-slate-800">
      <button id="tabLoginBtn" onclick="switchAuthTab('login')" class="py-2.5 text-xs font-bold rounded-xl transition-all flex items-center justify-center space-x-1.5 bg-amber-500 text-slate-950 shadow-md shadow-amber-500/20">
        <i data-lucide="log-in" class="w-3.5 h-3.5"></i>
        <span>Kirish</span>
      </button>
      <button id="tabRegisterBtn" onclick="switchAuthTab('register')" class="py-2.5 text-xs font-bold text-slate-400 hover:text-white rounded-xl transition-all flex items-center justify-center space-x-1.5">
        <i data-lucide="store" class="w-3.5 h-3.5"></i>
        <span>Yangi Do'kon</span>
      </button>
    </div>

    <!-- Alert / Toast -->
    <div id="authAlert" class="hidden mb-5 p-3.5 rounded-2xl text-xs font-semibold border flex items-center space-x-2.5">
      <i id="alertIcon" data-lucide="info" class="w-4 h-4 flex-shrink-0"></i>
      <span id="alertText">Xabar matni</span>
    </div>

    <!-- 1. LOGIN FORM -->
    <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
      <div>
        <label class="block text-xs font-bold text-slate-300 mb-1.5">Telefon raqam yoki Login</label>
        <div class="relative">
          <i data-lucide="phone" class="w-4 h-4 text-slate-500 absolute left-3.5 top-3.5"></i>
          <input type="text" id="loginPhone" required placeholder="998901234567" 
            class="input-clean w-full bg-slate-950 border border-slate-800 focus:border-amber-500 text-white rounded-2xl pl-10 pr-4 py-2.5 text-xs font-semibold focus:outline-none placeholder:text-slate-600">
        </div>
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-300 mb-1.5">Parol</label>
        <div class="relative">
          <i data-lucide="lock" class="w-4 h-4 text-slate-500 absolute left-3.5 top-3.5"></i>
          <input type="password" id="loginPassword" required placeholder="Parolni kiriting" 
            class="input-clean w-full bg-slate-950 border border-slate-800 focus:border-amber-500 text-white rounded-2xl pl-10 pr-10 py-2.5 text-xs font-semibold focus:outline-none placeholder:text-slate-600">
          <button type="button" onclick="togglePassVisibility('loginPassword', 'eyeIconLogin')" class="absolute right-3.5 top-3 text-slate-500 hover:text-slate-300 transition">
            <i id="eyeIconLogin" data-lucide="eye" class="w-4 h-4"></i>
          </button>
        </div>
      </div>

      <button type="submit" id="loginSubmitBtn" class="w-full py-3 bg-amber-500 hover:bg-amber-400 text-slate-950 font-black rounded-2xl text-xs transition-all shadow-lg shadow-amber-500/20 hover:shadow-amber-500/30 flex items-center justify-center space-x-2 active:scale-[0.99]">
        <span>Tizimga Kirish</span>
        <i data-lucide="arrow-right" class="w-4 h-4"></i>
      </button>
    </form>

    <!-- 2. REGISTER FORM -->
    <form id="registerForm" onsubmit="handleRegister(event)" class="space-y-3.5 hidden">
      <div>
        <label class="block text-xs font-bold text-slate-300 mb-1.5">Do'kon nomi *</label>
        <div class="relative">
          <i data-lucide="store" class="w-4 h-4 text-slate-500 absolute left-3.5 top-3.5"></i>
          <input type="text" id="regStoreName" required placeholder="Masalan: Baraka Savdo" 
            class="input-clean w-full bg-slate-950 border border-slate-800 focus:border-amber-500 text-white rounded-2xl pl-10 pr-4 py-2.5 text-xs font-semibold focus:outline-none placeholder:text-slate-600">
        </div>
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-300 mb-1.5">Do'kon egasi ismi *</label>
        <div class="relative">
          <i data-lucide="user" class="w-4 h-4 text-slate-500 absolute left-3.5 top-3.5"></i>
          <input type="text" id="regOwnerName" required placeholder="Ismingizni kiriting" 
            class="input-clean w-full bg-slate-950 border border-slate-800 focus:border-amber-500 text-white rounded-2xl pl-10 pr-4 py-2.5 text-xs font-semibold focus:outline-none placeholder:text-slate-600">
        </div>
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-300 mb-1.5">Telefon raqam (Kirish logini) *</label>
        <div class="relative">
          <i data-lucide="phone" class="w-4 h-4 text-slate-500 absolute left-3.5 top-3.5"></i>
          <input type="text" id="regPhone" required placeholder="998901234567" 
            class="input-clean w-full bg-slate-950 border border-slate-800 focus:border-amber-500 text-white rounded-2xl pl-10 pr-4 py-2.5 text-xs font-semibold focus:outline-none placeholder:text-slate-600">
        </div>
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-300 mb-1.5">Parol *</label>
        <div class="relative">
          <i data-lucide="lock" class="w-4 h-4 text-slate-500 absolute left-3.5 top-3.5"></i>
          <input type="password" id="regPassword" required placeholder="Yangi parol o'ylab toping" 
            class="input-clean w-full bg-slate-950 border border-slate-800 focus:border-amber-500 text-white rounded-2xl pl-10 pr-10 py-2.5 text-xs font-semibold focus:outline-none placeholder:text-slate-600">
          <button type="button" onclick="togglePassVisibility('regPassword', 'eyeIconReg')" class="absolute right-3.5 top-3 text-slate-500 hover:text-slate-300 transition">
            <i id="eyeIconReg" data-lucide="eye" class="w-4 h-4"></i>
          </button>
        </div>
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-300 mb-1.5">Manzil (shahar, tuman)</label>
        <div class="relative">
          <i data-lucide="map-pin" class="w-4 h-4 text-slate-500 absolute left-3.5 top-3.5"></i>
          <input type="text" id="regAddress" placeholder="Masalan: Toshkent sh., Chilonzor" 
            class="input-clean w-full bg-slate-950 border border-slate-800 focus:border-amber-500 text-white rounded-2xl pl-10 pr-4 py-2.5 text-xs font-semibold focus:outline-none placeholder:text-slate-600">
        </div>
      </div>

      <button type="submit" id="regSubmitBtn" class="w-full py-3 bg-amber-500 hover:bg-amber-400 text-slate-950 font-black rounded-2xl text-xs transition-all shadow-lg shadow-amber-500/20 hover:shadow-amber-500/30 flex items-center justify-center space-x-2 active:scale-[0.99]">
        <span>Do'kon Ochish So'rovini Yuborish</span>
        <i data-lucide="arrow-right" class="w-4 h-4"></i>
      </button>
    </form>

  </div>

  <!-- Minimal Footer -->
  <p class="mt-6 text-center text-[11px] text-slate-500">
    BeeAnaliz &copy; 2026. Xavfsiz va tezkor do'kon tizimi.
  </p>

  <script>
    lucide.createIcons();

    // Check query params for default tab
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('tab') === 'register') {
      switchAuthTab('register');
    }

    function switchAuthTab(tab) {
      const loginForm = document.getElementById('loginForm');
      const registerForm = document.getElementById('registerForm');
      const tabLoginBtn = document.getElementById('tabLoginBtn');
      const tabRegisterBtn = document.getElementById('tabRegisterBtn');
      const alertBox = document.getElementById('authAlert');
      alertBox.classList.add('hidden');

      if (tab === 'login') {
        loginForm.classList.remove('hidden');
        registerForm.classList.add('hidden');
        tabLoginBtn.className = "py-2.5 text-xs font-bold rounded-xl transition-all flex items-center justify-center space-x-1.5 bg-amber-500 text-slate-950 shadow-md shadow-amber-500/20";
        tabRegisterBtn.className = "py-2.5 text-xs font-bold text-slate-400 hover:text-white rounded-xl transition-all flex items-center justify-center space-x-1.5";
      } else {
        loginForm.classList.add('hidden');
        registerForm.classList.remove('hidden');
        tabRegisterBtn.className = "py-2.5 text-xs font-bold rounded-xl transition-all flex items-center justify-center space-x-1.5 bg-amber-500 text-slate-950 shadow-md shadow-amber-500/20";
        tabLoginBtn.className = "py-2.5 text-xs font-bold text-slate-400 hover:text-white rounded-xl transition-all flex items-center justify-center space-x-1.5";
      }
      lucide.createIcons();
    }

    function togglePassVisibility(inputId, iconId) {
      const input = document.getElementById(inputId);
      const icon = document.getElementById(iconId);
      if (input.type === 'password') {
        input.type = 'text';
        icon.setAttribute('data-lucide', 'eye-off');
      } else {
        input.type = 'password';
        icon.setAttribute('data-lucide', 'eye');
      }
      lucide.createIcons();
    }

    function showAlert(msg, isError = false) {
      const alertBox = document.getElementById('authAlert');
      const alertText = document.getElementById('alertText');
      const alertIcon = document.getElementById('alertIcon');

      alertText.textContent = msg;
      alertBox.classList.remove('hidden');

      if (isError) {
        alertBox.className = "mb-5 p-3.5 rounded-2xl text-xs font-bold border flex items-center space-x-2.5 bg-red-950/60 text-red-300 border-red-800/80";
        alertIcon.setAttribute('data-lucide', 'alert-circle');
      } else {
        alertBox.className = "mb-5 p-3.5 rounded-2xl text-xs font-bold border flex items-center space-x-2.5 bg-emerald-950/60 text-emerald-300 border-emerald-800/80";
        alertIcon.setAttribute('data-lucide', 'check-circle-2');
      }
      lucide.createIcons();
    }

    async function handleLogin(e) {
      e.preventDefault();
      const phone = document.getElementById('loginPhone').value.trim();
      const password = document.getElementById('loginPassword').value.trim();
      const btn = document.getElementById('loginSubmitBtn');

      btn.disabled = true;
      btn.innerHTML = `<span>Tekshirilmoqda...</span>`;

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ phone, password })
        });
        const data = await res.json();

        if (!res.ok) {
          showAlert(data.detail || "Kirishda xatolik yuz berdi!", true);
          btn.disabled = false;
          btn.innerHTML = `<span>Tizimga Kirish</span> <i data-lucide="arrow-right" class="w-4 h-4"></i>`;
          lucide.createIcons();
          return;
        }

        // Save session
        localStorage.setItem('bee_token', data.token);
        localStorage.setItem('bee_store_id', data.store_id);
        localStorage.setItem('bee_store_name', data.store_name);
        if (data.is_admin) {
          localStorage.setItem('bee_is_admin', 'true');
        } else {
          localStorage.removeItem('bee_is_admin');
        }

        showAlert(data.is_admin ? "Administrator sifatida kirildi! Admin panel ochilmoqda..." : "Muvaffaqiyatli kirildi! Dashboard ochilmoqda...", false);

        setTimeout(() => {
          if (data.is_admin) {
            window.location.href = '/admin';
          } else {
            window.location.href = '/dashboard';
          }
        }, 500);

      } catch (err) {
        showAlert("Server bilan ulanishda xatolik!", true);
        btn.disabled = false;
        btn.innerHTML = `<span>Tizimga Kirish</span> <i data-lucide="arrow-right" class="w-4 h-4"></i>`;
        lucide.createIcons();
      }
    }

    async function handleRegister(e) {
      e.preventDefault();
      const store_name = document.getElementById('regStoreName').value.trim();
      const owner_name = document.getElementById('regOwnerName').value.trim();
      const phone = document.getElementById('regPhone').value.trim();
      const password = document.getElementById('regPassword').value.trim();
      const address = document.getElementById('regAddress').value.trim();
      const btn = document.getElementById('regSubmitBtn');

      btn.disabled = true;
      btn.innerHTML = `<span>So'rov yuborilmoqda...</span>`;

      try {
        const res = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ store_name, owner_name, phone, password, address })
        });
        const data = await res.json();

        if (!res.ok) {
          showAlert(data.detail || "Ro'yxatdan o'tishda xatolik!", true);
          btn.disabled = false;
          btn.innerHTML = `<span>Do'kon Ochish So'rovini Yuborish</span> <i data-lucide="arrow-right" class="w-4 h-4"></i>`;
          lucide.createIcons();
          return;
        }

        btn.disabled = false;
        btn.innerHTML = `<span>Do'kon Ochish So'rovini Yuborish</span> <i data-lucide="arrow-right" class="w-4 h-4"></i>`;
        lucide.createIcons();

        document.getElementById('registerForm').reset();
        showAlert(data.message || "Do'kon ochish so'rovingiz qabul qilindi! Administrator tasdiqlaganidan so'ng tizimga kirishingiz mumkin.", false);

        setTimeout(() => {
          switchAuthTab('login');
          document.getElementById('loginPhone').value = phone;
        }, 2500);

      } catch (err) {
        showAlert("Server bilan ulanishda xatolik!", true);
        btn.disabled = false;
        btn.innerHTML = `<span>Do'kon Ochish So'rovini Yuborish</span> <i data-lucide="arrow-right" class="w-4 h-4"></i>`;
        lucide.createIcons();
      }
    }
  </script>
</body>
</html>
